<div class="centered column col-12">
    <h2><a href="{{ post.url }}">{{ post.title }}</a></h2>
    <p class="flex-centered subtitle">
        {% if post.category %}
        Category:&nbsp;<a href="{{post.category | slugify}}">{{post.category}}</a>&nbsp;|
        {% endif %}
        Posted: {{ post.date | date: "%B %d, %Y" }}</p>
    <p>{{ post.excerpt }}</p>
</div>
