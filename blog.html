---
layout: default
title: Blog
description: Aster Fialla's blog.
---
<div class="flex-centered columns col-sm-11 col-10 col-mx-auto">
    {% for post in site.posts %}
    <div class="centered column col-12 col-mc">
        <h2><a href="{{ post.url }}">{{ post.title }}</a></h2>
        <p class="flex-centered subtitle">Posted {{ post.date | date: "%B %d, %Y" }}</p>
        <p>{{ post.excerpt }}</p>
    </div>
    {% endfor %}
</div>
