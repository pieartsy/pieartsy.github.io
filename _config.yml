title: Aster Fialla
description: Aster Fialla's portfolio, blog, and miscellaneous other things.
author: Aster Fialla
domain: asterfialla.com     # if you want to force HTTPS, specify the domain without the http at the start, e.g. example.com
url: https://asterfialla.com  # the base hostname and protocol for your site, e.g. http://example.com
layout: default
excerpt_separator: <!--more-->
collections_dir: collections
collections:
  twine:
    output: true
    permalink: games/:title
  piece:
    output: true
    permalink: games/:title
  ttrpg:
    output: true
    permalink: games/:title
  posts:
    output: true
    permalink: blog/:title

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll/tagging
  - jekyll-paginate-v2

feed:
  icon: /images/avvie.png
  excerpt_only: true
#  disable_in_development: true
  categories:
    - essays
    - devlogs
    - meta
    - poems
    - drawings
    - microblogs
  collections:
    - twine
    - ttrpg
    - piece

tag_page_layout: tagpage
tag_page_dir: blog/tag
tag_page_data:
  sitemap: false


defaults:
  - scope:
      path: ""
    values:
      type: "website"
      title: Aster Fialla
      directory: /images
      image: /portraits.png
      alt: "Aster, a person with pink hair, surrounded by illustrations of erself in many different art styles."
      image_path: /assets/images/posts/
  -
    scope:
      path: ""
      type: "twine"
    values:
      layout: "gamepage"
      verb: "Play"
  -
    scope:
      path: ""
      type: "piece"
    values:
      layout: "gamepage"
      verb: "Explore"
  -
    scope:
      path: ""
      type: "ttrpg"
    values:
      layout: "gamepage"
      verb: "Read"
  - scope:
      path: ""
      type: "posts"
    values:
      type: "article"
      layout: "posts"


############################################################
# Site configuration for the Jekyll 3 Pagination Gem
# The values here represent the defaults if nothing is set
pagination:

  # Site-wide kill switch, disabled here it doesn't run at all
  enabled: true

  # The default document collection to paginate if nothing is specified ('posts' is default)
  collection: 'posts'

  # How many objects per paginated page, used to be `paginate` (default: 0, means all)
  per_page: 10

  # Optional, sorts the posts in reverse order (omit to default decending or sort_reverse: true)
  sort_reverse: true

  # The permalink structure for the paginated pages (this can be any level deep)
  permalink: '/blog/page/:num.html' # Pages are html files, linked jekyll extensionless permalink style.

  # Optional the title format for the paginated pages (supports :title for original page title, :num for pagination page number, :max for total number of pages)
  title: ':title - page :num'

  # Limit how many paginated pages to create (default: 0, means all)
  limit: 0

 # Optional,omit or set both before and after to zero to disable.
 # Controls how the pagination trail for the paginated pages look like.
  trail:
    before: 2
    after: 2

  # Optional, the default file extension for generated pages (e.g html, json, xml).
  # Internally this is set to html by default
  extension: html

  # Optional, the default name of the index file for generated pages (e.g. 'index.html')
  # Without file extension
  indexpage: '/blog'

############################################################