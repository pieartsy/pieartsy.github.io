base_url = "https://asterfialla.com"

title = "Aster Fialla"
description = "Aster Fialla's portfolio, blog, and miscellaneous other things."
author = "Aster Fialla"

default_language = "en"

# When set to "true", a feed is automatically generated.
generate_feeds = true
feed_filenames = ["feed.xml"]

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = true
generate_sitemap = true
generate_robots_txt = true
exclude_paginated_pages_in_sitemap = "all"

[markdown]
# Whether to do syntax highlighting
# Theme can be customised by setting the `highlight_theme` variable to a theme supported by Zola
highlight_code = true
render_emoji = true
smart_punctuation = true
definition_list = true
github_alerts = true

[search]
# Whether to include the title of the page/section in the index
include_title = true
# Whether to include the description of the page/section in the index
include_description = true
# Whether to include the RFC3339 datetime of the page in the search index
include_date = false
# Whether to include the path of the page/section in the index (the permalink is always included)
include_path = false
# Whether to include the rendered content of the page/section in the index
include_content = true
truncate_content_length = 500

[extra]
# Put all your custom variables here

