illos:
  - illo: assets/images/illos/Laios devourer.png
    illoalt: Laios from Delicious in Dungeon in a monstrous form, about to eat a heart. The drawing is rendered in red and yellow.
    illothumb: assets/images/illos/Laios devourer thumb.png
    illothumbalt: Laios from Delicious in Dungeon in a monstrous form.
    illotitle: Laios the Devourer
    illoid: laios

  - illo: assets/images/illos/dor and cathabel.png
    illoalt: Princess Cathabel, wearing a naval coat over a glamorous dress, and her girlfriend Dor, a smirking alien with grey skin and black eyes and everyday wear. Dor is picking at Cathabel's epaulettes and smirking while Cathabel looks indignant.
    illothumb: assets/images/illos/dor and cathabel thumb.png
    illothumbalt: Princess Cathabel and her alien girlfriend, Dor.
    illotitle: Dor and Cathabel
    illoid: dorAndCath

  - illo: assets/images/illos/Manny.png
    illoalt: A satyr, Manny, disguised as a human waving burlesque fans in the air. Each panel of the fan renders Manny in different art styles from the 1970s.
    illothumb: assets/images/illos/Manny thumb.png
    illothumbalt: A psychedelic satyr, Manny.
    illotitle: Manny
    illoid: manny

  - illo: assets/images/illos/moderngentlemen.png
    illoalt: A trans man in a gold and red robe that's opened to show his chest, boxers with bulge, and phalloplasty scars. He raises one leg in the air.
    illothumb: assets/images/illos/moderngentlemen thumb.png
    illothumbalt: A trans man in a gold and red robe, smoking.
    illotitle: Modern Gentlemen
    illoid: gentlemen

  - illo: assets/images/illos/polyam_prima.png
    illoalt: A man and woman kissing and being affectionate toward an enby, in a pastiche of the Anne Hathaway Twelfth Night promo image. Instead of a sword, the woman is holding an elbow crutch up for the man to grasp. The enby looks surprised.
    illothumb: assets/images/illos/polyam_prima thumb.png
    illothumbalt: A person receiving kisses and affection from two other people.
    illotitle: Tria Night
    illoid: triaprima

  - illo: assets/images/illos/cynosures.png
    illoalt: Four people in Asian-inspired clothing, dressed as a betta fish, a goat, a mushroom, and a bee. Despite the goat's best effort to stop them, the mushroom trips and throws multiple cups of tea into the air, which the bee tries to catch. The fish stares at the scene, unthinkingly pouring tea onto the ground.
    illothumb: assets/images/illos/cynosures thumb.png
    illothumbalt: A mushroom person tripping and throwing a platter in the air while a goat person tries to stop them.
    illotitle: Twilight's Oasis Cynosures
    illoid: cynosures

  - illo: assets/images/illos/motw.png
    illoalt: A man in a plaid suit looks up at the stars while an angel with a purple suit and gold wings looks at him lovingly. The first man says, 'The stars sure are beautiful tonight.' The second replies, 'Sure are.'
    illothumb: assets/images/illos/motw thumb.png
    illothumbalt: A man in a plaid suit looks up at the stars.
    illotitle: Monster of the Week
    illoid: motw

  - illo: assets/images/illos/gitfr.png
    illoalt: Three kids argue in front of a giant robot, not paying attention to the giant meteor hurtling toward them. The words 'Get in the Fucking Robot' are overlaid over the scene.
    illothumb: assets/images/illos/gitfr thumb.png
    illothumbalt: Three kids argue in front of a giant robot.
    illotitle: Get in the Fucking Robot
    illoid: gitfr

  - illo: assets/images/illos/zephyr.png
    illoalt: Zephyr, a person with red and yellow clothing, eyes, and hair, speeds through the clouds on a hover skateboard, with a pocket knife open in their hand.
    illothumb: assets/images/illos/zephyr thumb.png
    illothumbalt: Zephyr, a person with red and yellow hair and eyes, smirks at the viewer.
    illotitle: Zephyr
    illoid: zephyr

  - illo: assets/images/illos/strahd.png
    illoalt: A busty vampire woman, Lady Strahd, with a large brooch in her cleavage swirls a wine glass in her hand. She reclines on thin air.
    illothumb: assets/images/illos/strahd thumb.png
    illothumbalt: A busty vampire woman, Lady Strahd, with a large brooch in her cleavage.
    illotitle: Lady Strahd
    illoid: strahd

  - illo: assets/images/illos/half light.png
    illoalt: Seven images of Disco Elysium's Harry Du Bois overlaid on each other. He looks strung out, strangling, shooting, and punching faceless figures. The drawing is darkly colored, but his eyes and RCM patches are bright white.
    illothumb: assets/images/illos/half light thumb.png
    illothumbalt: Three images of Harry Du Bois overlaid on each other.
    illotitle: Half Light
    illoid: halflight

