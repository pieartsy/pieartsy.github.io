artprojs:
  - artproj: Thank You For Joining the Algorithm
    artprojyear: 2023
    artprojimg: assets/images/algorithmproj.png
    artprojalt: A snippet of a traditional comic with an AI creation reaching out to grab the main character.
    artprojdesc: "A submission to Thank You For Joining the Algorithm, a magazine by Tenebrous Press celebrating the connection between humanity and creativity in the face of algorithmic dominion. The magazine can be bought at <a href='https://store.tenebrouspress.com/products/thank-you-for-joining-the-algorithm-magazine-print-copy-ebook?_pos=2&_psq=thank+you&_ss=e&_v=1.0'>Tenebrous Press</a>."

  - artproj: Twilight's Oasis rulebook art
    artprojyear: 2022
    artprojimg: assets/images/cynosuresproj.png
    artprojalt: Three people dressed as a wood mushroom, a bluejay, and a bee.
    artprojdesc: "Rulebook art for the mythical Cynosures from the upcoming LARP, Twilight's Oasis. A preview of the rulebook can be seen on <a href='https://www.instagram.com/p/Cl6QlNAN_nO/'>Twilight Oasis' instagram.</a>."

  - artproj: Get in the Fucking Robot cover
    artprojyear: 2021
    artprojimg: assets/images/gitfrproj.png
    artprojalt: Three kids arguing in front of a giant robot.
    artprojdesc: "A cover for the PDF of the tabletop RPG, <a href='https://penguinking.com/get-in-the-fucking-robot/'>Get in the Fucking Robot</a>, by Penguin King Games."

  - artproj: Make a Scene
    artprojyear: 2020
    artprojimg: assets/images/makeascene.png
    artprojalt: Several toyetic robots step out of a retro spaceship.
    artprojdesc: "An anthology of LARPs for <a href='http://makeascenemn.org/en/'>Make a Scene</a>. I illustrated the cover art for Boldly Go."

  - artproj: Fandom Zines
    artprojyear: 2017-2019
    artprojimg: assets/images/projs.png
    artprojalt: Tiny versions of 3 comic pages, not meant to be readable.
    artprojdesc: "<p> Several comics done for zines in the My Hero Academia and Voltron: Legendary Defender fandoms. These zines were focused around celebrating concepts or specific characters from each piece of media.
      <ul>
        <li><a href='https://bnha-poly-ships-zine.tumblr.com/'>Enough Love to Go Around zine</a></li>
        <li><a href='https://yourpowerzine.tumblr.com/post/178090475908'>Your Power zine</a></li>
        <li><a href='https://coranzine.tumblr.com'>The Gorgeous Man zine</a></li>
      </ul>
    </p>"

  - artproj: "Serving Pride: The Queer History Dinner Party Handbook"
    artprojyear: 2017
    artprojimg: assets/images/servingpride.png
    artprojalt: A small girl and an older man read a ritual by candle light.
    artprojdesc: "An illustrated handbook of queer history presented as a dinner party. I illustrated the art for the candle ritual in Chapter 6. The book can be bought at <a href='https://www.geeksout.org/serving-pride/'>Geeks Out.</a>"

comics:
  - comic: comic1
    pages:
    - page: lmg1
      pagealt: A woman in a pirate coat has a gun showdown with a lizardesque alien with the lower body of a beetle, in a sci-fi room covered in slime. She says, reaching for her gun, 'Captain? Is there any way you would consider giving me the pearl and leaving this ship alone?' The alien captain tenses toward his gun as well and asks, 'Are you going to make me?' She says, 'I would rather not.' He replies, 'And I, similarly, would rather not, Ebenezabeth.' Suddenly she draws and shoots.
    - page: lmg2
      pagealt: The captain skitters up the wall and aims at Ebenezabeth, who skids behind a pillar to avoid his shots. She waits for her moment then shoots the pipe next to him, which releases a burst of cold and stuns him.
    - page: lmg3
      pagealt: Ebenezabeth shoots again, hitting the captain's abdomen. He slides to the ground and groans, 'Right in the spinneret! That's not very honorable.' Ebenezabeth helps him stand up and replies, 'Neither is plundering a ship full of frozen people.' He snickers, 'Well you can't hold pirates to the same--' but is cut off by a spasm of pain.
    - page: lmg4
      pagealt: Ebenezabeth points at the captain's gunshot wound and quips, 'You'd better have your ship's doctor take a look at that.' The captain sulks away but Ebenezabeth taps him on the epaulette. He shouts, 'What is it?' She holds out a hand and says, 'Aren't you forgetting something?' Grumbling, the captain drops the pearl in Ebenezabeth's hand and skitters into a duct.

  - comic: comic2
    pages:
    - page: algorithm1
      pagealt: A person sits at er computer desk in er bedroom and clicks on the 'I'm not a robot' captcha on a login screen. Se waits for the captcha to load, then grips the monitor in shock. In lieu of normal captcha images, 9 distorted AI facsimiles of er face stare back. The captcha reads, 'Select all squares with you'.
    - page: algorithm2
      pagealt: One of the AI faces starts to move in the frame while the person stares in horror. Suddenly, it shoots out a hand with too many fingers, grabbing through the screen toward the person, who is yanked into the monitor.
    - page: algorithm3
      pagealt: The person dizzily looks up behind a 9 panel window, when a mouse cursor appears and starts clicking on the panels. From their perspective, they see the AI figure now in the real world, grinning back at them. The AI clicks the mouse with its distorted, countless-fingered hand, and a checkbox appears next to the captcha.