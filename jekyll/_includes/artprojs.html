{% for item in site.data.pics.artprojs %}
<div class="column col-6 col-md-12">
    <section class="card">
        <hgroup class="card-header">
            <h3>{{ item.artproj }}</h3>
            <h4>{{ item.artprojyear }}</h4>
        </hgroup>
        <img src="{{ item.artprojimg }}" class="img-responsive card-image" alt="{{ item.artprojalt }}">
        <div class="card-body">
            {{ item.artprojdesc }}
        </div>
    </section>
</div>

{% endfor %}
