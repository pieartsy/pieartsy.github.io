pieces:
  - title: Compassionate Simulation
    folder: compsim
    link: compsim.html
    image: compsim.png
    blurb: >
      <blockquote><i>—our company mission to provide grieving families with accurate, compassionate simulations of their deceased loved ones—</i><br><br>

      You! Winnifred Meyer. Remember? You are Winnifred Meyer, and you died at age twenty-six in a car accident.</blockquote>
      <p>A Twinefied adaption of Compassionate Simulation, a short story by <a  href="http://rachelswirsky.com/">Rachel Swirsky</a> and <a href="https://twitter.com/P_H_Lee">P H Lee</a>. Originally published in <a href="https://uncannymagazine.com/article/compassionate-simulation/">Uncanny Magazine</a>, I adapted it with the authors' permission; the adaption's original publication was in <a target="_blank" href="https://sub-q.com/compassionate-simulation/">subQ magazine</a>.</p>

  - title: Reflecting my face in the mirror
    folder: reflecting
    link: reflecting.html
    image: reflecting.png
    blurb: <p>A dynamic poem for the Neo-Twiny Jam. Not mobile-friendly.</p>